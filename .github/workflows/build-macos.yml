name: Build MediaPipe Face Landmarker for macOS 14 (v0.10.35)

on:
  workflow_dispatch:

# 严格遵循项目 .bazelversion 文件的要求
env:
  USE_BAZEL_VERSION: '7.4.1'

jobs:
  build-macos:
    # 使用 macos-14 Runner (Apple Silicon)
    runs-on: macos-14 
    
    steps:
    - name: Checkout repository (tag v0.10.35)
      uses: actions/checkout@v4
      with:
        ref: v0.10.35
        fetch-depth: 1

    - name: Select Xcode 15.4
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4' 

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' 

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy absl-py

    - name: Install OpenCV and FFmpeg via Homebrew
      run: |
        echo "Installing OpenCV and FFmpeg..."
        brew install opencv ffmpeg

    - name: Patch WORKSPACE and BUILD files for macOS (Safe String Replace)
      run: |
        python3 -c '
        import os

        print("Patching WORKSPACE for Homebrew Apple Silicon paths...")
        with open("WORKSPACE", "r") as f:
            ws_content = f.read()

        ws_content = ws_content.replace("path = \"/usr/local\",", "path = \"/opt/homebrew\",")
        ws_content = ws_content.replace("path = \"/usr/local/opt/opencv\",", "path = \"/opt/homebrew/opt/opencv\",")
        ws_content = ws_content.replace("path = \"/usr/local/opt/ffmpeg\",", "path = \"/opt/homebrew/opt/ffmpeg\",")

        with open("WORKSPACE", "w") as f:
            f.write(ws_content)

        print("Patching third_party/opencv_macos.BUILD for OpenCV 4...")
        build_file = "third_party/opencv_macos.BUILD"
        with open(build_file, "r") as f:
            build_content = f.read()

        build_content = build_content.replace("PREFIX = \"opt/opencv@3\"", "PREFIX = \"opt/opencv\"")
        build_content = build_content.replace("\"include/opencv2/**/*.h*\"", "\"include/opencv4/opencv2/**/*.h*\"")
        build_content = build_content.replace("includes = [paths.join(PREFIX, \"include/\")]", "includes = [paths.join(PREFIX, \"include/opencv4\")]")

        with open(build_file, "w") as f:
            f.write(build_content)

        print("Configuration patched successfully!")
        '

    - name: Verify Bazel version
      run: bazel --version

    - name: Build MediaPipe Face Landmarker
      run: |
        echo "Starting build with Bazel 7.4.1, Xcode 15.4, and patched OpenCV 4 config..."
        
        bazel build -c opt --config=macos \
          --define MEDIAPIPE_DISABLE_GPU=1 \
          --incompatible_enable_cc_toolchain_resolution \
          //mediapipe/tasks/cc/vision/face_landmarker:face_landmarker

    # 🌟 修改步骤：提取第三方依赖头文件到当前工作区目录 (不再打包为 tar.gz)
    - name: Collect External Headers into Directory
      run: |
        echo "Extracting external headers from Bazel cache..."
        BAZEL_OUT=$(bazel info output_base)
        
        # 将目标目录设置为当前工作区下的 mp_external_headers 文件夹
        DEST="${{ github.workspace }}/mp_external_headers"
        mkdir -p "$DEST/absl" "$DEST/tensorflow"

        # 1. 拷贝 absl 头文件
        echo "Copying Abseil (absl) headers..."
        cp -r "$BAZEL_OUT/external/com_google_absl/absl" "$DEST/"

        # 2. 拷贝 TFLite 头文件
        # 注意：必须先 cd 到 org_tensorflow 目录，这样 cpio 提取出的才是干净的相对路径 (tensorflow/lite/...)
        echo "Copying TensorFlow Lite headers..."
        cd "$BAZEL_OUT/external/org_tensorflow"
        find tensorflow/lite -name "*.h" | cpio -pdm "$DEST/"
        cd - > /dev/null # 返回原工作目录

        # 3. 检查其他关键依赖 (仅打印日志，方便确认)
        echo "Checking for other dependencies (glog, Eigen, etc.) in Bazel cache:"
        ls "$BAZEL_OUT/external/" | grep -E "eigen|glog|com_github" || echo "No matching extra dependencies found."

        echo "Header extraction complete. Directory structure:"
        ls -la "$DEST"

    # 🌟 更新步骤：直接上传编译产物和头文件目录
    - name: Upload Build Artifacts
      if: success() 
      uses: actions/upload-artifact@v4
      with:
        name: mediapipe-macos14-v0.10.35-full-package
        path: |
          # 1. 编译生成的静态库/目标文件目录
          bazel-bin/mediapipe/tasks/cc/vision/face_landmarker/
          # 2. 第三方依赖头文件目录 (直接上传文件夹)
          mp_external_headers/
        retention-days: 14 
