name: Build MediaPipe Native Library

on:
  workflow_dispatch:
  push:
    paths:
      - 'face_landmarker_android.cc'
      - 'BUILD_android.append'
      - '.github/workflows/build-mediapipe-native.yml'

env:
  USE_BAZEL_VERSION: '7.4.1'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
        include:
          - abi: arm64-v8a
            bazel_config: android_arm64
          - abi: armeabi-v7a
            bazel_config: android_arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy absl-py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK and NDK
        run: |
          bash ./setup_android_sdk_and_ndk.sh ~/Android/Sdk ~/Android/Sdk/ndk r28b --accept-licenses

      - name: Inject cc_binary wrapper and BUILD rule
        run: |
          if ! grep -q "libmediapipe_face_landmarker" BUILD.bazel; then
            cat BUILD_android.append >> BUILD.bazel
          fi

      - name: Build FaceLandmarker .so
        run: |
          bazel build -c opt \
            --config=${{ matrix.bazel_config }} \
            --define MEDIAPIPE_GPU_BUFFER_USE_GL=1 \
            //:libmediapipe_face_landmarker.so

      - name: Extract .so and headers
        run: |
          BAZEL_OUT=$(bazel info output_base)
          mkdir -p output/${{ matrix.abi }}/libs
          mkdir -p output/${{ matrix.abi }}/include

          cp bazel-bin/libmediapipe_face_landmarker.so \
             output/${{ matrix.abi }}/libs/

          for dir in \
            mediapipe \
            "$BAZEL_OUT/external/com_google_absl" \
            "$BAZEL_OUT/external/com_google_protobuf/src" \
            "$BAZEL_OUT/external/flatbuffers/include" \
            "$BAZEL_OUT/external/eigen3"; do
            if [ -d "$dir" ]; then
              find "$dir" -name "*.h" -exec cp --parents {} output/${{ matrix.abi }}/include/ \;
            fi
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-native-${{ matrix.abi }}
          path: output/${{ matrix.abi }}/
          retention-days: 14
